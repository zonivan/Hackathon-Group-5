<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US State GeoGuesser - Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>US State GeoGuesser</h1>
            <p>Where in the US are you?</p>
            <p class="hint">Hint: Look for famous landmarks, state capitol buildings, or iconic locations!</p>
            <div th:if="${showHint}" class="state-hint-box">
                <p class="hint-text"><strong>Hint:</strong> <span th:text="${stateHint}"></span></p>
            </div>
            <div th:unless="${showHint}" class="hint-action">
                <a href="/show-hint" class="btn btn-hint">Need a Hint?</a>
            </div>
        </div>
        
        <div class="game-container">
            <!-- Static Street View Image -->
            <div class="street-view">
                <img th:src="@{'https://maps.googleapis.com/maps/api/streetview?size=800x500&location=' + ${location.latitude} + ',' + ${location.longitude} + '&heading=' + ${location.heading} + '&pitch=' + ${location.pitch} + '&fov=90&key=AIzaSyD8rGPrNmvHG6Osv1ArD3icAoZWtviF4Aw'}" 
                     alt="Street View" width="100%" height="100%">
            </div>
            
            <div class="guess-options">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="dropdown">Use Dropdown</button>
                    <button class="tab-btn" data-tab="map">Use Map</button>
                </div>
                
                <div class="tab-content" id="dropdown-tab">
                    <form class="guess-form" action="/check-state" method="post">
                        <div class="form-group">
                            <label for="stateGuess">Which state is this?</label>
                            <select id="stateGuess" name="stateGuess" required>
                                <option value="">Select a state...</option>
                                <option th:each="state : ${stateNames}" th:value="${state}" th:text="${state}"></option>
                            </select>
                        </div>
                        
                        <div style="text-align: center;">
                            <button type="submit" class="btn">Submit State Guess</button>
                        </div>
                    </form>
                </div>
                
                <div class="tab-content hidden" id="map-tab">
                    <p>Select the state you think this is:</p>
                    <div class="us-map-container">
                        <div class="state-grid">
                            <!-- States grid layout -->
                            <div class="state-row">
                                <button class="state-btn" data-state="Washington">WA</button>
                                <button class="state-btn" data-state="Oregon">OR</button>
                                <button class="state-btn" data-state="Idaho">ID</button>
                                <button class="state-btn" data-state="Montana">MT</button>
                                <button class="state-btn" data-state="North Dakota">ND</button>
                                <button class="state-btn" data-state="Minnesota">MN</button>
                                <button class="state-btn" data-state="Wisconsin">WI</button>
                                <button class="state-btn" data-state="Michigan">MI</button>
                            </div>
                            <div class="state-row">
                                <button class="state-btn" data-state="California">CA</button>
                                <button class="state-btn" data-state="Nevada">NV</button>
                                <button class="state-btn" data-state="Utah">UT</button>
                                <button class="state-btn" data-state="Wyoming">WY</button>
                                <button class="state-btn" data-state="South Dakota">SD</button>
                                <button class="state-btn" data-state="Iowa">IA</button>
                                <button class="state-btn" data-state="Illinois">IL</button>
                                <button class="state-btn" data-state="Ohio">OH</button>
                            </div>
                            <div class="state-row">
                                <button class="state-btn" data-state="Arizona">AZ</button>
                                <button class="state-btn" data-state="Colorado">CO</button>
                                <button class="state-btn" data-state="Kansas">KS</button>
                                <button class="state-btn" data-state="Missouri">MO</button>
                                <button class="state-btn" data-state="Indiana">IN</button>
                                <button class="state-btn" data-state="Kentucky">KY</button>
                                <button class="state-btn" data-state="West Virginia">WV</button>
                                <button class="state-btn" data-state="Pennsylvania">PA</button>
                            </div>
                            <div class="state-row">
                                <button class="state-btn" data-state="New Mexico">NM</button>
                                <button class="state-btn" data-state="Oklahoma">OK</button>
                                <button class="state-btn" data-state="Arkansas">AR</button>
                                <button class="state-btn" data-state="Tennessee">TN</button>
                                <button class="state-btn" data-state="Virginia">VA</button>
                                <button class="state-btn" data-state="Maryland">MD</button>
                                <button class="state-btn" data-state="Delaware">DE</button>
                                <button class="state-btn" data-state="New Jersey">NJ</button>
                            </div>
                            <div class="state-row">
                                <button class="state-btn" data-state="Texas">TX</button>
                                <button class="state-btn" data-state="Louisiana">LA</button>
                                <button class="state-btn" data-state="Mississippi">MS</button>
                                <button class="state-btn" data-state="Alabama">AL</button>
                                <button class="state-btn" data-state="Georgia">GA</button>
                                <button class="state-btn" data-state="South Carolina">SC</button>
                                <button class="state-btn" data-state="North Carolina">NC</button>
                                <button class="state-btn" data-state="Connecticut">CT</button>
                            </div>
                            <div class="state-row">
                                <button class="state-btn" data-state="Alaska">AK</button>
                                <button class="state-btn" data-state="Hawaii">HI</button>
                                <button class="state-btn" data-state="Florida">FL</button>
                                <button class="state-btn" data-state="Vermont">VT</button>
                                <button class="state-btn" data-state="New Hampshire">NH</button>
                                <button class="state-btn" data-state="Massachusetts">MA</button>
                                <button class="state-btn" data-state="Rhode Island">RI</button>
                                <button class="state-btn" data-state="Maine">ME</button>
                            </div>
                            <div class="state-row">
                                <button class="state-btn" data-state="Nebraska">NE</button>
                                <button class="state-btn" data-state="New York">NY</button>
                            </div>
                        </div>
                    </div>
                    <form id="map-form" action="/check-state" method="post">
                        <input type="hidden" id="map-state-guess" name="stateGuess" value="">
                        <div id="map-selected-state" class="selected-state">
                            No state selected
                        </div>
                        <div style="text-align: center;">
                            <button type="submit" class="btn" disabled id="map-submit-btn">Submit State Guess</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Hackathon Group 5 JJ</p>
        </div>
    </div>
    
    <script>
        $(document).ready(function() {
            // Tab functionality
            $('.tab-btn').click(function() {
                $('.tab-btn').removeClass('active');
                $(this).addClass('active');
                
                const tabId = $(this).data('tab');
                $('.tab-content').addClass('hidden');
                $('#' + tabId + '-tab').removeClass('hidden');
            });
            
            // State buttons functionality
            $('.state-btn').click(function() {
                // Reset all states first
                $('.state-btn').removeClass('selected');
                
                // Highlight selected state
                $(this).addClass('selected');
                
                // Get state name from data attribute
                const stateName = $(this).data('state');
                
                // Update form values
                $('#map-state-guess').val(stateName);
                $('#map-selected-state').text('Selected: ' + stateName);
                $('#map-submit-btn').prop('disabled', false);
            });
        });
    </script>
</body>
</html>
